services:
  - type: web
    name: okx-asp-server
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true          # redeploys automatically on every GitHub push
    envVars:
      - key: NODE_ENV
        value: production
      - key: AGENTROUTER_API_KEY
        sync: false           # you paste this in the Render dashboard (never commit it)
      - key: AI_MODEL
        value: claude-sonnet-4-5-20250929
      - key: ASP_NAME
        value: Claude AI Research & Writing ASP
